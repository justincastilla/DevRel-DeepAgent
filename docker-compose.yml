services:
  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      # Mount source code for live reloading
      - .:/app
      # Persist generated reports outside the container
      - research_reports:/app/research_reports
      # Prevent container's venv from being overwritten by the host mount
      - /app/.venv
    env_file:
      - .env
    environment:
      # Point the app at the Redis service below (overrides .env if set there)
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  research_reports:
