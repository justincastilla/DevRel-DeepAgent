<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <style>
        /* --- Base --- */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #0f1117;
            --bg-card: #161922;
            --text: #e4e6f0;
            --text-secondary: #8b8fa3;
            --text-muted: #5a5e72;
            --border: #2a2d3e;
            --accent: #4f6cf7;
            --green: #34d399;
            --yellow: #fbbf24;
            --red: #f87171;
            --cyan: #22d3ee;
            --radius: 10px;
            --font-mono: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
            --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif;
        }

        body {
            font-family: var(--font-sans);
            background: var(--bg);
            color: var(--text);
            line-height: 1.7;
        }

        /* --- Layout --- */
        .report-header {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            padding: 20px 32px;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .report-header h1 {
            font-size: 1rem;
            font-weight: 600;
        }

        .report-meta {
            font-size: 0.78rem;
            color: var(--text-muted);
        }

        .back-link {
            color: var(--accent);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .report-body {
            max-width: 960px;
            margin: 0 auto;
            padding: 40px 32px 80px;
        }

        /* --- Typography --- */
        .report-body h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-top: 40px;
            margin-bottom: 16px;
            color: var(--text);
            letter-spacing: -0.02em;
        }

        .report-body h2 {
            font-size: 1.35rem;
            font-weight: 600;
            margin-top: 36px;
            margin-bottom: 14px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
            color: var(--text);
        }

        .report-body h3 {
            font-size: 1.1rem;
            font-weight: 600;
            margin-top: 28px;
            margin-bottom: 10px;
            color: var(--accent);
        }

        .report-body h4 {
            font-size: 0.95rem;
            font-weight: 600;
            margin-top: 20px;
            margin-bottom: 8px;
            color: var(--cyan);
        }

        .report-body p {
            margin-bottom: 14px;
            color: var(--text);
        }

        .report-body a {
            color: var(--accent);
            text-decoration: none;
        }

        .report-body a:hover {
            text-decoration: underline;
        }

        .report-body strong {
            color: #fff;
            font-weight: 600;
        }

        .report-body ul, .report-body ol {
            margin-bottom: 14px;
            padding-left: 24px;
        }

        .report-body li {
            margin-bottom: 6px;
        }

        .report-body blockquote {
            border-left: 3px solid var(--accent);
            padding: 10px 20px;
            margin: 16px 0;
            background: rgba(79, 108, 247, 0.06);
            border-radius: 0 var(--radius) var(--radius) 0;
            color: var(--text-secondary);
        }

        .report-body hr {
            border: none;
            border-top: 1px solid var(--border);
            margin: 32px 0;
        }

        /* --- Tables --- */
        .report-body table {
            width: 100%;
            border-collapse: collapse;
            margin: 16px 0 24px;
            font-size: 0.88rem;
        }

        .report-body thead th {
            background: var(--bg-card);
            padding: 10px 14px;
            text-align: left;
            font-weight: 600;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--text-secondary);
            border-bottom: 2px solid var(--border);
        }

        .report-body tbody td {
            padding: 10px 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }

        .report-body tbody tr:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        /* --- Code --- */
        .report-body code {
            font-family: var(--font-mono);
            background: var(--bg-card);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.85em;
            color: var(--cyan);
        }

        .report-body pre {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px 20px;
            margin: 16px 0;
            overflow-x: auto;
            font-size: 0.85rem;
            line-height: 1.6;
        }

        .report-body pre code {
            background: none;
            padding: 0;
            color: var(--text);
        }

        /* --- Images --- */
        .report-body img {
            max-width: 100%;
            border-radius: var(--radius);
            margin: 16px 0;
        }

        /* --- Scrollbar --- */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

        /* --- Print --- */
        @media print {
            .report-header { position: static; }
            body { background: #fff; color: #111; }
            .report-body h2 { border-bottom-color: #ccc; color: #111; }
            .report-body h3 { color: #333; }
            .report-body a { color: #1a0dab; }
            .report-body code { background: #f0f0f0; color: #333; }
            .report-body pre { background: #f5f5f5; border-color: #ddd; }
            .report-body table thead th { background: #f5f5f5; color: #333; }
        }

        /* --- Responsive --- */
        @media (max-width: 768px) {
            .report-body { padding: 24px 16px 60px; }
            .report-header { padding: 14px 16px; }
            .report-body h1 { font-size: 1.4rem; }
            .report-body table { font-size: 0.8rem; }
        }
    </style>
</head>
<body>
    <header class="report-header">
        <div>
            <a href="/" class="back-link">&larr; Back to Dashboard</a>
        </div>
        <div class="report-meta">
            {{ filename }} &middot; {{ generated }}
        </div>
    </header>

    <article class="report-body">
        {{ content | safe }}
    </article>
</body>
</html>
